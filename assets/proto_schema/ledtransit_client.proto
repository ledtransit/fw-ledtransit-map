syntax = "proto2";
package ledtransit_client;

message ClientMessage {
    required uint32 version = 1;
    oneof payload {
        ServerInfo server_info = 2; // Server -> Client
        DeviceInfo device_info = 3; // Client -> Server
        DeviceStatus status = 4; // Server <-> Client
        DeviceConfig config = 5; // Server <-> Client
        DeviceUpdate device_update = 6; // Server -> Client
        DeviceTelemetry telemetry = 7; // Client -> Server
        DeviceCommand command = 8; // Server -> Client
        DeviceErrors errors = 9; // Client -> Server
        TransitData transit_data = 10; // Server -> Client
        Echo echo = 11; // Server <-> Client
        DeviceProfiling profiling = 12; // Client -> Server
        TimeSync time_sync = 13; // Client <-> Server
    }
}

// On join and hourly: local time. Times of day are seconds since local
// midnight, in config.timezone_iana. unix_timestamp sets the clock until the
// first TimeSync
message ServerInfo {
    required uint32 unix_timestamp = 1;
    required uint32 local_time_of_day_seconds = 2;
    required uint32 local_weekday_number = 3; // 0 = Sunday
    required uint32 local_sunrise_time_of_day_seconds = 4;
    required uint32 local_sunset_time_of_day_seconds = 5;
}

// In reply to ServerInfo
message DeviceInfo {
    required uint32 firmware_version_major = 1;
    required uint32 firmware_version_minor = 2;
    required uint32 firmware_version_patch = 3;
    required bool is_beta_firmware = 4;
    required bool is_rolled_back_firmware = 5;
    required bool is_factory_firmware = 6;
    required bytes build_id = 7; // SHA-256 of the running image (esptool image-info's "Validation hash"), zeros if unknown
    required InstallMethod install_method = 8;
}

// On join and on change. Not persisted: resets on reboot. The client only
// takes is_light_on from the server
message DeviceStatus {
    required bool is_light_on = 1;
    required bool is_updating_firmware = 2;
    required bool has_update_failed = 3;
    required string wifi_ssid = 4;
    optional DeviceCommand command_awaiting_confirmation = 5; // See DeviceCommand
    required bool is_remote_control_enabled = 6; // When off, the client ignores status, config and commands. Re-enabled only by holding Up and Down on the map
}

// On join and on change. User preferences, persisted on the device and in the cloud
message DeviceConfig {
    required uint32 brightness_percent = 1;
    required uint32 current_limit_ma = 2;
    required ColorMode color_mode = 3;
    required uint32 primary_color_rgb8 = 4;
    required uint32 secondary_color_rgb8 = 5;
    required uint32 tertiary_color_rgb8 = 6;
    required int32 color_temperature_shift = 7;
    required DisruptionMode disruption_mode = 8;
    required uint32 disruption_primary_color_rgb8 = 9; // SUSPENDED disruptions
    required uint32 disruption_brightness_percent = 10;
    required uint32 animation_speed_percent = 11;
    required RenderMode render_mode = 12;
    required VehicleFilter vehicle_filter = 13;
    required uint32 vehicle_distance_threshold_meters = 14;
    required TimerSettings timer_settings = 15;
    required bool auto_firmware_update_enabled = 16;
    required uint32 min_delay_minutes = 17;
    required uint32 max_delay_minutes = 18;
    required uint32 min_speed_kmph = 19;
    required uint32 max_speed_kmph = 20;
    repeated LineConfig line_configs = 21;
    optional string timezone_iana = 22;
    required RealtimeFilter realtime_filter = 23;
    required DisruptionInterval disruption_interval = 24;
    required SunlightAutoBrightness sunlight_auto_brightness = 25;
    optional Coordinates location_coord = 26;
    optional string location_name = 27;
    required DisruptionFilter disruption_filter = 28;
    required uint32 disruption_secondary_color_rgb8 = 29; // Delay disruptions
    required bool disruptions_enabled = 30;
}

// A firmware update is available
message DeviceUpdate {
    required uint32 firmware_version_major = 1;
    required uint32 firmware_version_minor = 2;
    required uint32 firmware_version_patch = 3;
    required string image_url = 4;
    required string changelog_url = 5;
    required uint32 size_bytes = 6;
    required bytes sha256_hash = 7;
    required bytes p256_signature = 8;
}

// Every 15 s while transit data arrives, every 5 min while it's stale, and on
// change. *_total counters count up since boot (reset on reboot, see
// uptime_seconds): rates are differences between two messages
message DeviceTelemetry {
    required uint32 uptime_seconds = 1;
    required int32 wifi_rssi_dbm = 2;
    required uint32 current_estimate_milliamps = 3;
    required uint32 update_progress_percent = 4;
    required uint32 update_speed_bytes_per_second = 5;
    required uint32 num_vehicles_available = 6;
    required uint32 num_vehicles_visible = 7;
    required uint32 num_pixels_on = 8;
    required uint32 last_transit_data_received_unix_timestamp = 9;
    required uint32 last_transit_data_sourced_unix_timestamp = 10;
    required uint32 last_transit_data_simulated_until_unix_timestamp = 11;
    required uint32 num_disruptions_available = 13;
    required uint32 num_disruptions_visible = 14;
    required uint32 heap_size_bytes = 16;
    required uint32 heap_max_used_bytes = 17;
    required uint32 heap_current_used_bytes = 18;
    required string feed_source = 19;
    required uint32 num_vehicles_visible_real_time = 20;
    required uint32 brightness_percent = 22; // Effective, including sunlight auto brightness
    optional uint32 auto_update_scheduled_unix_timestamp = 23;
    optional uint32 command_confirmation_deadline_unix_timestamp = 24; // For status.command_awaiting_confirmation
    required float display_frames_per_second = 25; // LED updates, 0 without updates
    required uint64 gateway_rx_bytes_total = 26; // TCP payload, including TLS, HTTP and WebSocket overhead
    required uint64 gateway_tx_bytes_total = 27; // TCP payload, including TLS, HTTP and WebSocket overhead
    required uint64 ota_rx_bytes_total = 28; // TCP payload of firmware downloads
    required uint64 transit_data_rx_bytes_total = 29; // WebSocket payload
    required uint32 transit_data_rx_count_total = 30;
    required uint32 transit_data_errors_total = 31; // Decode error, timeout or too large
    required uint32 gateway_connections_total = 32;
    required uint32 wifi_connections_total = 33;
    required uint32 gateway_connected_seconds = 34; // Of the current connection
    required uint32 last_transit_data_size_bytes = 35; // 0 before the first
    required uint32 last_transit_data_receive_millis = 36; // From frame header to payload decoded, 0 before the first
    required ResetReason reset_reason = 37;
    required uint32 boot_count_total = 38; // Persisted, survives factory resets. Includes this boot, 0 if unknown
    required uint32 settings_writes_total = 39; // Flash writes
    required uint64 executor_stalled_micros_total = 40; // See ProfilingPoint.executor_stalled_micros
    required uint32 wifi_last_disconnect_reason = 41; // ESP-IDF wifi_err_reason_t, 0 if none
    required uint32 button_presses_total = 42;
    required float chip_temperature_celsius = 43; // Internal sensor, ±1 °C within -10..80 °C, NaN if unavailable
    // The TimeSync the clock follows, unset before the first
    optional uint32 time_sync_round_trip_micros = 44;
    optional sint32 time_sync_correction_micros = 45; // Clock error that following it corrected
    optional uint32 time_sync_measured_unix_timestamp = 46;
    optional uint32 time_sync_uncertainty_micros = 47; // Of the clock now: half the round trip, plus the crystal's possible drift since
    optional sint32 time_sync_slew_remaining_micros = 48; // Of the correction, still being slewed
    // Time sync since boot
    optional uint32 time_sync_last_burst_round_trip_micros = 49; // Shortest of the last burst, followed or not. Unset before the first burst
    required uint32 time_sync_requests_total = 50;
    required uint32 time_sync_replies_total = 51; // Valid ones
    required uint32 time_sync_bursts_total = 52; // Finished
    required uint32 time_sync_corrections_total = 53; // TimeSyncs followed
    required uint32 time_sync_steps_total = 54; // Corrections that stepped the clock (the first, or over 1 s) instead of slewing it
}

// FACTORY_RESET, REPROVISION and DISABLE_REMOTE_CONTROL only run once
// confirmed with a button press on the map within 30 s.
// CLEAR_PENDING_CONFIRMATION drops the command awaiting confirmation, if any
enum DeviceCommand {
    DEVICE_COMMAND_REBOOT = 0;
    DEVICE_COMMAND_IDENTIFY = 1;
    DEVICE_COMMAND_FACTORY_RESET = 2;
    DEVICE_COMMAND_REPROVISION = 3;
    DEVICE_COMMAND_RESET_CONFIG_DEFAULTS = 4;
    DEVICE_COMMAND_START_FIRMWARE_UPDATE = 5;
    DEVICE_COMMAND_TEST_LEDS = 6;
    DEVICE_COMMAND_RECONNECT = 7;
    DEVICE_COMMAND_DISABLE_REMOTE_CONTROL = 8;
    DEVICE_COMMAND_CLEAR_PENDING_CONFIRMATION = 9;
}

// Once per boot, for development: when each step from reset to the first
// transit data painted was first reached. Unset if it wasn't
message DeviceProfiling {
    // Init
    optional ProfilingPoint main_entered = 1;
    optional ProfilingPoint rtos_started = 2;
    optional ProfilingPoint settings_loaded = 3;
    optional ProfilingPoint device_keys_checked = 4;
    optional ProfilingPoint tasks_spawned = 5;
    optional ProfilingPoint wifi_radio_initialized = 6;
    optional ProfilingPoint tls_initialized = 7; // CA bundle parsed
    optional ProfilingPoint station_configured = 8;
    optional ProfilingPoint app_initialized = 9;
    optional ProfilingPoint wifi_connect_requested = 10;
    // WiFi
    optional ProfilingPoint wifi_connect_started = 11;
    optional ProfilingPoint wifi_connected = 12;
    optional ProfilingPoint ip_configured = 13; // DHCP done
    // Gateway
    optional ProfilingPoint gateway_connect_started = 14;
    optional ProfilingPoint gateway_dns_resolved = 15;
    optional ProfilingPoint gateway_tcp_connected = 16;
    optional ProfilingPoint gateway_tls_client_hello_sent = 17;
    optional ProfilingPoint gateway_tls_server_hello_received = 18;
    optional ProfilingPoint gateway_tls_certificate_checked = 19; // TLS 1.2 only
    optional ProfilingPoint gateway_tls_server_flight_processed = 20; // TLS 1.2 only
    optional ProfilingPoint gateway_tls_client_key_exchange_sent = 21;
    optional ProfilingPoint gateway_tls_handshake_done = 22;
    optional ProfilingPoint claim_challenge_received = 23; // First connection after setup only
    optional ProfilingPoint claim_accepted = 24; // First connection after setup only
    optional ProfilingPoint gateway_challenge_received = 25;
    optional ProfilingPoint gateway_proof_computed = 26;
    optional ProfilingPoint gateway_ws_established = 27;
    optional ProfilingPoint first_status_sent = 28;
    // First messages
    optional ProfilingPoint first_server_info_received = 29;
    optional ProfilingPoint first_config_received = 30;
    optional ProfilingPoint first_transit_data_header_received = 31;
    optional ProfilingPoint first_transit_data_payload_received = 32;
    optional ProfilingPoint first_transit_data_cleared = 33; // Previous data freed
    optional ProfilingPoint first_transit_data_decoded = 34;
    optional ProfilingPoint first_transit_data_stored = 35;
    optional ProfilingPoint first_line_configs_updated = 36;
    optional ProfilingPoint boot_confirmed = 37; // OTA image marked valid
    // Render and paint
    optional ProfilingPoint painter_fade_out_started = 38;
    optional ProfilingPoint painter_fade_out_done = 39;
    optional ProfilingPoint first_transit_data_rendered = 40;
    optional ProfilingPoint first_disruptions_rendered = 41;
    optional ProfilingPoint first_transit_data_painted = 42;
    optional ProfilingPoint first_transit_data_paint_skipped = 43; // Light off
    // Until profiling finished
    required uint32 wifi_connect_attempts = 44;
    required uint32 gateway_connect_attempts = 45;
}

message ProfilingPoint {
    required uint64 micros_since_boot = 1;
    required uint32 free_heap_bytes = 2;
    required uint32 executor_stalled_micros = 3; // Since boot, time the async executor was blocked for over 1 ms at a time
}

// On error
message DeviceErrors {
    repeated DeviceError errors = 1;
}

// On join and every 30 s. Line and stop IDs are indices into lines and stops (16 bit)
message TransitData {
    required uint32 sourced_at_unix_timestamp = 1;
    required uint32 simulated_until_unix_timestamp = 2;
    required string feed_source = 3;
    repeated Line lines = 4;
    repeated Stop stops = 5;
    repeated VehicleMovement vehicle_movements = 6;
    repeated Disruption disruptions = 7;
}

// Clock measurement, like NTP. The client sends it in bursts (4 times, 500 ms
// apart) on connect and every 10 min, with only client_send_micros_since_boot set.
// The server sends it back right away, with the unix times it received and
// sent it at: read and answered ahead of other messages. Times in microseconds
message TimeSync {
    required uint64 client_send_micros_since_boot = 1;
    optional uint64 server_receive_unix_timestamp_micros = 2;
    optional uint64 server_send_unix_timestamp_micros = 3;
}

// Sent back unchanged, for reachability and latency tests from the app
message Echo {
    required uint32 id = 1;
    required uint64 timestamp_milliseconds = 2;
}

// --- TYPES ---

enum InstallMethod {
    INSTALL_METHOD_UNKNOWN = 0; // Installed before install tracking, until the production self-test passes
    INSTALL_METHOD_FACTORY = 1; // Flashed at production, self-test passed
    INSTALL_METHOD_USB = 2; // Flashed over USB after production
    INSTALL_METHOD_OTA = 3;
}

// ESP32-C3 reset reason codes
enum ResetReason {
    RESET_REASON_UNKNOWN = 0;
    RESET_REASON_CHIP_POWER_ON = 1; // Also a chip brownout or super watchdog reset
    RESET_REASON_CORE_SW = 3; // Reboot, panic or firmware update
    RESET_REASON_CORE_DEEP_SLEEP = 5;
    RESET_REASON_CORE_MWDT0 = 7;
    RESET_REASON_CORE_MWDT1 = 8;
    RESET_REASON_CORE_RTC_WDT = 9; // Firmware hung (see watchdog)
    RESET_REASON_CPU0_MWDT0 = 11;
    RESET_REASON_CPU0_SW = 12;
    RESET_REASON_CPU0_RTC_WDT = 13;
    RESET_REASON_SYS_BROWN_OUT = 15;
    RESET_REASON_SYS_RTC_WDT = 16;
    RESET_REASON_CPU0_MWDT1 = 17;
    RESET_REASON_SYS_SUPER_WDT = 18;
    RESET_REASON_SYS_CLK_GLITCH = 19;
    RESET_REASON_CORE_EFUSE_CRC = 20;
    RESET_REASON_CORE_USB_UART = 21;
    RESET_REASON_CORE_USB_JTAG = 22;
    RESET_REASON_CORE_PWR_GLITCH = 23;
}

enum DeviceErrorType {
    DEVICE_ERROR_TYPE_PANIC = 0;
    DEVICE_ERROR_TYPE_ERROR = 1;
    DEVICE_ERROR_TYPE_WARNING = 2;
}

message DeviceError {
    required DeviceErrorType type = 1;
    required uint32 instant_milliseconds = 2;
    required string file_name = 3;
    required uint32 line_number = 4;
    required uint32 column_number = 5;
    required string message = 6;
    required uint32 unix_timestamp = 7;
}

enum ColorMode {
    COLOR_MODE_ORIGINAL = 0;
    COLOR_MODE_MONOCHROME = 1;
    COLOR_MODE_RANGE_SPACED_APART = 2;
    COLOR_MODE_DELAY_HEATMAP = 3;
    COLOR_MODE_SPEED_HEATMAP = 4;
}

enum DisruptionMode {
    DISRUPTION_MODE_SOLID = 1;
    DISRUPTION_MODE_PULSING = 2;
    DISRUPTION_MODE_RIPPLE = 3;
}

// Severe: no alternative line (Disruption.affects_all_lines)
enum DisruptionFilter {
    DISRUPTION_FILTER_ALL = 0;
    DISRUPTION_FILTER_SEVERE = 1; // SUSPENDED or MAJOR_DELAYS, severe only
    DISRUPTION_FILTER_NO_SERVICE_SEVERE = 2; // SUSPENDED, severe only
    DISRUPTION_FILTER_NO_SERVICE_ALL = 3; // SUSPENDED
}

enum DisruptionInterval {
    DISRUPTION_INTERVAL_EVERY_2S = 0;
    DISRUPTION_INTERVAL_EVERY_3S = 1;
    DISRUPTION_INTERVAL_EVERY_5S = 2;
    DISRUPTION_INTERVAL_EVERY_10S = 3;
}

enum RenderMode {
    RENDER_MODE_SNAP_CLOSEST = 0;
    RENDER_MODE_SNAP_CLOSEST_TRANSITION = 1;
}

enum VehicleFilter {
    VEHICLE_FILTER_ALL = 0;
    VEHICLE_FILTER_WITHIN_DISTANCE = 1;
    VEHICLE_FILTER_STATIONARY_ONLY = 2;
}

enum RealtimeFilter {
    REALTIME_FILTER_SCHEDULED_AND_REALTIME = 0;
    REALTIME_FILTER_REALTIME_ONLY = 1;
}

message TimerSettings {
    required bool enabled = 1;
    required uint32 start_time_of_day_seconds = 2; // Since local midnight
    required uint32 end_time_of_day_seconds = 3; // Since local midnight
    required uint32 weekdays_bitmask = 4; // Bit 0 = Sunday
}

message LineConfig {
    required string line_name = 1;
    required bool enabled = 2;
    required bool has_override = 3;
    required uint32 original_color_rgb8 = 4;
    required uint32 override_color_rgb8 = 5;
    required uint32 brightness_percent = 6;
}

message SunlightAutoBrightness {
    required bool enabled = 1;
    required uint32 night_brightness_percent = 2;
    required uint32 day_brightness_percent = 3;
}

message Line {
    required string name = 1;
    required uint32 color_rgb8 = 2;
}

message Stop {
    required sint32 latitude_e7 = 1;
    required sint32 longitude_e7 = 2;
    required bool is_station = 3; // Else a via stop, only shaping the track between stations
}

message Coordinates {
    required int32 latitude_e7 = 1;
    required int32 longitude_e7 = 2;
}

message VehicleMovement {
    required uint32 line_id = 1;
    required uint32 trip_id = 2; // Stable unique ID
    required sint32 start_offset_seconds = 3; // Relative to sourced_at_unix_timestamp
    repeated MovementSegment segments = 4; // Back to back, in order
}

message MovementSegment {
    required uint32 from_stop_id = 1;
    required uint32 to_stop_id = 2;
    repeated ViaStop via_stops = 3; // In order from from_stop_id to to_stop_id
    required uint32 move_seconds = 4; // All legs
    required uint32 wait_seconds = 5; // At to_stop_id, after moving
    optional sint32 delayed_seconds = 6; // Unset without real-time data
    required bool cancelled = 7;
    required uint32 average_speed_kmph = 8;
}

message ViaStop {
    required uint32 stop_id = 1;
    required uint32 move_seconds = 2; // Of the leg ending at this stop
}

// With to_stop_id: the track from from_stop_id to to_stop_id. Without: only at
// from_stop_id, in the direction given by one of the direction hints
message Disruption {
    required uint32 line_id = 1;
    required uint32 disruption_id = 2; // Stable unique ID
    required uint32 from_stop_id = 3;
    optional uint32 to_stop_id = 4;
    optional uint32 direction_hint_to_stop_id = 5; // Towards this stop. Takes precedence over direction_hint_from_stop_id
    optional uint32 direction_hint_from_stop_id = 6; // Coming from this stop
    required bool bidirectional = 7;
    required uint32 stop_count = 8;
    required bool entire_line = 9;
    required bool affects_all_lines = 10; // All lines serving the affected stops: no alternative
    required DisruptionType type = 11;
    optional uint32 via_stop_id = 12; // Only the route from from_stop_id to to_stop_id through this stop
}

enum DisruptionType {
    SUSPENDED = 0; // No service
    MINOR_DELAYS = 1; // Trips late or cancelled
    MAJOR_DELAYS = 2; // Trips heavily late or cancelled
}
