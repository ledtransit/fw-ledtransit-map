[package]
edition = "2024"
name = "fw-ledtransit-map"
rust-version = "1.88"
version = "1.1.1"
license = "GPL-3.0-only"
authors = ["Tim Holzhey <info@ledtransit.com>"]

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable", "defmt"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "defmt"] }
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4",
  "tcp",
  "dns",
  "defmt",
] }
esp-alloc = { version = "0.11.0", features = ["defmt", "internal-heap-stats"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c3",
  "unstable",
  "wifi",
  "defmt",
] }
smoltcp = { version = "0.13.1", default-features = false, features = [
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-tcp",
  "defmt",
] }
critical-section = "1.2.0"
static_cell = "2.1.1"
rgb = "0.8.53"
smart-leds = "0.4.0"
envparse = "0.1.0"
embassy-sync = "0.8.0"
embassy-futures = { version = "0.1.2", features = ["defmt"] }
defmt = { version = "1.1.1", features = ["alloc"] }
esp-storage = { version = "0.10.0", features = ["esp32c3", "defmt"] }
heapless = { version = "0.9.3", features = ["defmt", "serde"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", features = ["defmt"] }
edge-dhcp = { version = "0.8.0", features = ["defmt"] }
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", features = ["defmt"] }
embedded-io-async = "0.7.0"
edge-net = "0.16.0"
edge-http = { version = "0.8.0", features = ["defmt"] }
serde-json-core = { version = "0.7.0", features = ["defmt"] }
edge-ws = { version = "0.8.0", features = ["defmt"] }
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
bytes = { version = "1.12.1", features = [
  "extra-platforms",
], default-features = false }
condtype = "1.3.0"
defmt-rtt = { version = "1.3.0" }
p256 = { version = "0.14.0", features = [
  "alloc",
  "arithmetic",
  "ecdsa",
  "pem",
], default-features = false }
nb = "1.1.0"
nourl = { version = "0.1.5", features = ["defmt"] }
# Only the TLS algorithms in use, instead of mbedtls' full default set. Beyond
# the base mbedtls-rs always needs (TLS 1.2/1.3 client, ECDHE-ECDSA, AES-GCM,
# SHA-256, P-256, X.509/PEM parsing): RSA and SHA-256 for the root ISRG Root X1,
# P-384 and SHA-384 for the Let's Encrypt intermediates, and ECDHE-RSA for RSA
# server certificates. A 2 KB instead of 16 KB send buffer per connection: the
# device only sends small records (larger writes are split), but receives full
# 16 KB ones. Builds mbedtls from source (needs clang and cmake)
mbedtls-rs = { version = "0.3.0", default-features = false, features = [
  "defmt",
  "ssl-out-content-len-2048",
  "alg-rsa",
  "alg-sha512",
  "curve-secp384r1",
  "kex-ecdhe-rsa",
] }
edge-nal-tls = { version = "0.3.0", default-features = false, features = ["defmt"] }

[build-dependencies]
prost-build = "0.14.4"

[profile.release]
codegen-units = 1
lto = 'fat'
opt-level = 'z'
panic = 'abort'
